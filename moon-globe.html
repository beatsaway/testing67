<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Whole Moon</title>
  <style>
    html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.4 sans-serif; }
    #c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
    #photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #05060a; display: none; }
    #ui { position: fixed; top: 8px; left: 8px; z-index: 2; max-width: 340px; padding: 10px; border-radius: 8px; background: rgba(20,20,20,.9); }
    label { display: block; margin: 8px 0 2px; font-size: 12px; color: #ccc; }
    input[type=file] { width: 100%; font-size: 12px; }
    button { margin-top: 8px; padding: 6px 10px; cursor: pointer; }
    #status { margin-top: 8px; font-size: 12px; color: #9cf; }
  </style>
  <script src="./vendor/geotiff.js"></script>
  <script src="vendor/three.min.js"></script>
</head>
<body>
  <img id="photo" alt="Moon colour">
  <canvas id="c3d"></canvas>
  <div id="ui">
    <label>1. Colour — lroc_color_2k.jpg</label>
    <input id="color" type="file" accept=".jpg,.jpeg,.png">
    <label>2. Height — ldem_16_uint.tif or ldem_4_uint.tif</label>
    <input id="height" type="file" accept=".tif,.tiff">
    <button id="build" type="button">Show</button>
    <div id="status">Load the colour file first. That is only a flat photo.</div>
  </div>
  <script>
    function dragOrbit(camera, dom) {
      const state = { down: false, x: 0, y: 0, theta: 0.9, phi: 1.15, r: camera.position.length() };
      function apply() {
        camera.position.set(
          state.r * Math.sin(state.phi) * Math.sin(state.theta),
          state.r * Math.cos(state.phi),
          state.r * Math.sin(state.phi) * Math.cos(state.theta)
        );
        camera.lookAt(0, 0, 0);
      }
      dom.addEventListener('pointerdown', (e) => { state.down = true; state.x = e.clientX; state.y = e.clientY; });
      addEventListener('pointerup', () => { state.down = false; });
      addEventListener('pointermove', (e) => {
        if (!state.down) return;
        state.theta -= (e.clientX - state.x) * 0.008;
        state.phi = Math.max(0.25, Math.min(2.7, state.phi + (e.clientY - state.y) * 0.008));
        state.x = e.clientX; state.y = e.clientY;
        apply();
      });
      dom.addEventListener('wheel', (e) => {
        state.r = Math.max(R * 1.2, Math.min(R * 8, state.r + e.deltaY * 2));
        apply();
      }, { passive: true });
      apply();
      return { update() {} };
    }

    const R = 1737.4;
    const statusEl = document.getElementById('status');
    const photo = document.getElementById('photo');
    const canvas = document.getElementById('c3d');
    let renderer, scene, camera, controls, mesh, colorURL;

    function init() {
      if (renderer) return;
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x05060a);
      camera = new THREE.PerspectiveCamera(45, 2, 1, 100000);
      camera.position.set(0, -R * 3.2, R * 1.2);
      controls = dragOrbit(camera, canvas);
      scene.add(new THREE.AmbientLight(0xffffff, 0.35));
      const sun = new THREE.DirectionalLight(0xffffff, 1.4);
      sun.position.set(R * 4, R, R * 2);
      scene.add(sun);
      (function frame() {
        requestAnimationFrame(frame);
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== w || canvas.height !== h) {
          renderer.setSize(w, h, false);
          camera.aspect = w / h || 1;
          camera.updateProjectionMatrix();
        }
        controls.update();
        renderer.render(scene, camera);
      })();
    }

    async function readHeight(file) {
      const tiff = await GeoTIFF.fromArrayBuffer(await file.arrayBuffer());
      const img = await tiff.getImage();
      const w = img.getWidth(), h = img.getHeight();
      const step = Math.max(1, Math.ceil(Math.max(w, h) / 720));
      const [data] = await img.readRasters({ samples: [0] });
      const sw = Math.ceil(w / step), sh = Math.ceil(h / step);
      const out = new Float32Array(sw * sh);
      let max = -Infinity;
      for (let y = 0; y < sh; y++) {
        for (let x = 0; x < sw; x++) {
          const v = Number(data[Math.min(h - 1, y * step) * w + Math.min(w - 1, x * step)]);
          out[y * sw + x] = Number.isFinite(v) ? v : 0;
          if (out[y * sw + x] > max) max = out[y * sw + x];
        }
      }
      return { data: out, w: sw, h: sh, uintOffset: max > 100 };
    }

    function sample(grid, u, v) {
      const x = Math.min(grid.w - 1, Math.max(0, Math.round(u * (grid.w - 1))));
      const y = Math.min(grid.h - 1, Math.max(0, Math.round(v * (grid.h - 1))));
      return grid.data[y * grid.w + x];
    }

    async function show() {
      const colorFile = document.getElementById('color').files[0];
      const heightFile = document.getElementById('height').files[0];
      if (!colorFile) { statusEl.textContent = 'Choose lroc_color_2k.jpg first.'; return; }
      if (colorURL) URL.revokeObjectURL(colorURL);
      colorURL = URL.createObjectURL(colorFile);
      photo.src = colorURL;
      photo.style.display = 'block';
      canvas.style.display = 'none';
      if (!heightFile) {
        statusEl.textContent = colorFile.name + ' is loaded. This is a flat photo. Add the height file, then click Show again.';
        return;
      }
      statusEl.textContent = 'Reading ' + heightFile.name + '…';
      init();
      const grid = await readHeight(heightFile);
      const geom = new THREE.SphereGeometry(R, 160, 80);
      const pos = geom.attributes.position;
      const uv = geom.attributes.uv;
      const n = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        const raw = sample(grid, uv.getX(i), 1 - uv.getY(i));
        const km = (grid.uintOffset ? (raw - 20000) / 2000 : raw) * 20;
        n.set(pos.getX(i), pos.getY(i), pos.getZ(i)).normalize();
        pos.setXYZ(i, n.x * (R + km), n.y * (R + km), n.z * (R + km));
      }
      geom.computeVertexNormals();
      const tex = await new THREE.TextureLoader().loadAsync(colorURL);
      tex.colorSpace = THREE.SRGBColorSpace;
      if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
      mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ map: tex, roughness: 1, metalness: 0 }));
      scene.add(mesh);
      photo.style.display = 'none';
      canvas.style.display = 'block';
      statusEl.textContent = 'Merged. ' + colorFile.name + ' paints it. ' + heightFile.name + ' makes the bumps.';
    }

    document.getElementById('build').addEventListener('click', () => show().catch((err) => {
      statusEl.textContent = err && err.message ? err.message : String(err);
    }));
  </script>
</body>
</html>
