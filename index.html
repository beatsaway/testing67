<style>

  html, body {

<script>
(function () {
  var canvas = document.getElementById("starfield");
  var ctx = canvas.getContext("2d");
  var stars = [];
  var dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(window.innerWidth * dpr);
    canvas.height = Math.floor(window.innerHeight * dpr);
  }
  function seed() {
    stars = [];
    var n = 260;
    for (var i = 0; i < n; i++) {
      var depth = Math.pow(Math.random(), 1.6);
      stars.push({
        x: Math.random(),
        y: Math.random(),
        r: (0.35 + depth * 1.7) * dpr,
        a: 0.18 + depth * 0.82,
        tw: Math.random() * Math.PI * 2,
        sp: 0.35 + Math.random() * 1.6,
        warm: Math.random() < 0.08,
        glow: depth > 0.82
      });
    }
  }
  resize();
  seed();
  window.addEventListener("resize", function () { resize(); seed(); });
  var t0 = performance.now();
  function paint(now) {
    var loader = document.getElementById("loader");
    if (!loader || loader.classList.contains("hide")) return;
    var t = (now - t0) / 1000;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var tw = 0.62 + 0.38 * Math.sin(t * s.sp + s.tw);
      if (s.glow) tw *= 0.75 + 0.25 * Math.sin(t * 0.37 + s.tw);
      var x = s.x * canvas.width;
      var y = s.y * canvas.height;
      ctx.globalAlpha = Math.max(0.05, s.a * tw);
      ctx.fillStyle = s.warm ? "#ffe2c4" : "#f7fbff";
      ctx.beginPath();
      ctx.arc(x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
      if (s.glow) {
        ctx.globalAlpha *= 0.22;
        ctx.beginPath();
        ctx.arc(x, y, s.r * 4.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    requestAnimationFrame(paint);
  }
  requestAnimationFrame(paint);

  var screen = document.querySelector("#loader .screen");
  var lines = document.querySelectorAll("#loader .line");
  var streak = document.querySelector("#loader .streak");
  function burst() {
    var loader = document.getElementById("loader");
    if (!loader || loader.classList.contains("hide")) return;
    var heavy = Math.random() < 0.22;
    streak.style.top = (8 + Math.random() * 78) + "%";
    for (var i = 0; i < lines.length; i++) {
      var el = lines[i];
      var dx = (Math.random() - 0.5) * (heavy ? 16 : 7);
      var top = Math.floor(Math.random() * 62);
      var bot = Math.floor(Math.random() * 28);
      el.style.setProperty("--nudge", ((Math.random() - 0.5) * (heavy ? 7 : 3)) + "px");
      el.style.setProperty("--tear", dx + "px");
      el.style.setProperty("--clip", "inset(" + top + "% 0 " + (100 - top - 22) + "% 0)");
      el.style.setProperty("--clipb", "inset(" + (top + 18) + "% 0 " + bot + "% 0)");
    }
    screen.classList.add("tear");
    setTimeout(function () { screen.classList.remove("tear"); }, heavy ? 170 : 80);
    setTimeout(burst, 900 + Math.random() * 2400);
  }
  setTimeout(burst, 600);
})();
</script>

<script type="module">
import * as THREE from "three";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const errBox = document.getElementById("err");
window.addEventListener("error", (e) => {
  errBox.style.display = "block";
  errBox.textContent = (e.message || "error") + (e.filename ? "\n" + e.filename + ":" + e.lineno : "");
});
window.addEventListener("unhandledrejection", (e) => {
  errBox.style.display = "block";
  errBox.textContent = String(e.reason && e.reason.stack || e.reason);
});

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf);
  const v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function fbm(x, y) {
  return vnoise(x, y) * 0.55 +
    vnoise(x * 2.03 + 9.1, y * 2.07 - 4.4) * 0.28 +
    vnoise(x * 4.11 + 21.7, y * 3.97 + 13.2) * 0.17;
}
function crater(x, z, cx, cz, r) {
  const d = Math.hypot(x - cx, z - cz);
  const bowl = smoothstep(r, r * 0.12, d);
  const rim = Math.exp(-((d - r * 0.86) ** 2) / (2 * (r * 0.16) ** 2));
  return -bowl * r * 0.42 + rim * r * 0.16;
}

const COLD = { x: 24, z: -4, r: 12 };
const extraCold = [];
const SPAN = 420;
const dimples = [];
for (let i = 0; i < 36; i++) {
  const u = hash2(i * 1.7, 4.2);
  const v = hash2(8.1, i * 2.3);
  dimples.push({
    x: (u - 0.5) * 300,
    z: (v - 0.5) * 260,
    r: 3.5 + hash2(i, 19) * 7,
    depth: 0.22 + hash2(i, 23) * 0.45,
  });
}
function dimple(x, z, c) {
  const d = Math.hypot(x - c.x, z - c.z);
  if (d > c.r * 1.35) return 0;
  const bowl = smoothstep(c.r, c.r * 0.22, d);
  const rim = Math.exp(-((d - c.r * 0.9) ** 2) / (2 * (c.r * 0.14) ** 2));
  return -bowl * c.depth + rim * c.depth * 0.45;
}

function terrainHeight(x, z) {
  let h = 0.05;
  h += (fbm(x * 0.012, z * 0.012) - 0.5) * 1.15;
  h += (fbm(x * 0.04 + 2.2, z * 0.037) - 0.5) * 0.42;
  h += (fbm(x * 0.11 + 6.4, z * 0.1) - 0.5) * 0.12;
  h += (fbm(x * 0.2 + 4.1, z * 0.18) - 0.5) * 0.16;
  const d = Math.hypot(x - COLD.x, z - COLD.z);
  h -= smoothstep(COLD.r + 10, COLD.r - 1, d) * 1.05;

trailShape = function (x, z) {
  const dx = x - start.x;
  const dz = z - start.z;
  const along = dx * Math.cos(outYaw) + dz * Math.sin(outYaw);
  const side = -dx * Math.sin(outYaw) + dz * Math.cos(outYaw);
  const across = Math.exp(-(side * side) / (2 * 18 * 18));
  let h = 0;
  if (along > 30 && Math.abs(side) < 48) {
    const far = Math.max(Math.abs(x), Math.abs(z));
    const road = Math.exp(-(side * side) / (2 * 34 * 34));
    h -= smoothstep(140, 230, far) * (6 + 10 * fbm(x * 0.012, z * 0.012)) * road;
  }
  const raceSpan = Math.max(18, marks.raceEnd.dist - marks.race.dist);
  const raceT = (along - marks.race.dist) / raceSpan;
  if (raceT > 0.0 && raceT < 1.2) {
    h -= 11 * smoothstep(0.04, 0.72, raceT) * across;
  }
  const hillT = (along - marks.hill.dist) / 34;
  if (hillT > -0.05 && hillT < 1.15) {
    const rise = smoothstep(0.0, 0.38, hillT) * (1 - smoothstep(0.62, 1.05, hillT));
    h += 9 * rise * Math.exp(-(side * side) / (2 * 11 * 11));
  }
  const cliffT = along - marks.cliff.dist;
  if (cliffT > -6 && cliffT < 22 && Math.abs(side) < 24) {
    const mask = Math.exp(-(side * side) / (2 * 12 * 12));
    h -= smoothstep(0.5, 3.2, cliffT) * 8 * mask;
  }
  const flipT = along - marks.flip.dist;
  if (flipT > -4 && flipT < 28) {
    const mask = Math.exp(-(side * side) / (2 * 9 * 9));
    h += side * 1.7 * mask;
  }
  return h;
};

      const settled = resolveRocks(here.x, here.z);
      yaw = faceOf(here);
      place(leader, settled, yaw);
      layWheelTracks();
      noteTravel(3.1 * dt);
      if (follower.group.visible) {
        const gap = 4.6;
        const backDist = route.dist - gap;
        if (backDist >= 0) {
          const back = pointAt(route.pts, backDist);
          if (back) {
            const clear = resolveRocks(back.x, back.z);
            place(follower, clear, faceOf(back));
          }
        } else {
          const clear = resolveRocks(
            here.x - Math.sin(yaw) * (gap - route.dist),
            here.z - Math.cos(yaw) * (gap - route.dist)
          );
          place(follower, clear, yaw);
        }
        spin(follower, 3.1 * dt / WHEEL_R);
      }
      setPrompt(groundNote(here.x, here.z));
    }
  }

  const px = leader.group.position.x;
  const pz = leader.group.position.z;
  const coldHere = inCold(px, pz);
  const driving = state === "drive" && Math.abs(speedMs) > 0.2;
  if (coldHere) {
    coldTime += dt * (perform && perform.id === "frozen" ? 6 : 1);
    battery = Math.max(0, battery - dt * 3.4);
    if (coldTime > 18) award("frozen");
  } else {
    coldTime = Math.max(0, coldTime - dt * 2.4);
    if (state === "drive") battery = Math.min(100, battery + dt * 2.4);
  }
  if (driving) battery = Math.max(0, battery - dt * 1.8);
  if (battery <= 0) award("power");
  const farD = Math.hypot(px - marks.far.x, pz - marks.far.z);
  const onD = Math.hypot(px - marks.onward.x, pz - marks.onward.z);
  const story = questNow();
  const lostReady = !story || story.id !== "lost" || (perform && perform.id === "lost" && perform.t > 0.45);
  const onReady = !story || story.id !== "lander" || (perform && perform.id === "lander" && perform.t > 0.45);
  if (lostReady && farD < 22) award("lost");
  else if (farD >= 22) badgeCool.lost = 0;
  if (onReady && onD < 18) award("lander");
  else if (onD >= 18) badgeCool.lander = 0;
  Object.keys(badgeCool).forEach((id) => {
    if (id === "lost" || id === "lander") return;
    if (badgeCool[id] > 0) badgeCool[id] = Math.max(0, badgeCool[id] - dt);
  });
  if (!perform && !cue && !badgeHold && state === "drive" && era === "drive" && questNow() && guide.visible) {
    if (Math.hypot(px - guideAt.x, pz - guideAt.z) < 18) beginPerform();
  }

  stepDust(dt);
  ensureGround(px, pz, 220);
  if (guide.visible) ensureGround(guideAt.x, guideAt.z, 80);
  bakeChunks(1);

  const coldNow = inCold(leader.group.position.x, leader.group.position.z);
  const sNow = slopeDeg(leader.group.position.x, leader.group.position.z);
  const sunW = coldNow ? 0 : Math.max(0, Math.round(1361 * Math.cos(sNow * Math.PI / 180)));
  setBar(sunBar, sunEl, sunW / 1361, 1 - sunW / 1361, sunW + " W/m²");
  setBar(slopeBar, slopeEl, Math.min(1, sNow / 20), Math.min(1, sNow / 18), sNow.toFixed(0) + "°");
  setBar(batBar, batEl, battery / 100, 1 - battery / 100, Math.round(battery) + "%");
  setBar(hullBar, hullEl, hull / 100, 1 - hull / 100, Math.round(hull) + "%");
  const sunLoad = coldNow ? 0 : 0.25 + throttle * 0.9;
  const targetT = coldNow ? -80 : 16 + sunLoad * 52;
  roverTemp += (targetT - roverTemp) * Math.min(1, dt * 0.35);
  if (!coldNow && roverTemp > 64) say("The rover is getting too hot.");
  if (coldNow && roverTemp < -30) say("The rover is getting too cold.");
  const tempBad = coldNow ? 0.95 : Math.min(1, Math.max(sNow / 18, roverTemp / 80));
  setBar(tempBar, tempEl, coldNow ? 0.15 : Math.min(1, 0.45 + roverTemp / 120), tempBad, Math.round(roverTemp) + "°C");
  if (leader.head) leader.head.rotation.y = Math.sin(clock.elapsedTime * 0.6) * 0.4;
  const crewDrive = Math.abs(speedMs) > 0.35;
  syncDriver();
  if (albaAboard && cameraCrew[0]) idleCrew(cameraCrew[0].person, clock.elapsedTime + 0.4, crewDrive);
  if (!albaAboard && leader.driver) idleCrew(leader.driver, clock.elapsedTime, crewDrive);
  if (follower.group.visible) idleCrew(follower.driver, clock.elapsedTime + 0.6, crewDrive);
  earthBody.rotation.y += dt * 0.003;
  cloudMesh.rotation.y += dt * 0.0045;
  filmRigs.forEach((rig) => {
    if (rig.flash > 0) {
      rig.flash = Math.max(0, rig.flash - dt * 1.7);
      const k = Math.sin((rig.flash / 1.15) * Math.PI);
      rig.lensMat.emissiveIntensity = 0.85 + Math.max(0, k) * 7;
      rig.lamp.intensity = Math.max(0, k) * 16;
    } else if (rig.lamp.intensity > 0) {
      rig.lensMat.emissiveIntensity = 0.85;
      rig.lamp.intensity = 0;
    }
  });

  let pose = null;
  if (cue && (cue.kind === "handoff" || cue.kind === "board" || cue.kind === "align")) {
    const drive = cue.kind === "board"
      ? roverCam(7.4, 3.2, 2.5, 0.5, 0.85)
      : roverCam(6.2, 1.35, 2.55, 1.4, 0.72);
    if (cue.kind === "handoff" && cue.cam0) {
      const held = {
        px: cue.cam0.x, py: cue.cam0.y, pz: cue.cam0.z,
        lx: cue.look0.x, ly: cue.look0.y, lz: cue.look0.z
      };
      pose = mixPose(held, drive, smoothstep(0, 1.2, cue.t));
    } else pose = drive;
    if (cue.done) {
      pose = roverCam(6.2, 1.35, 2.55, 1.4, 0.72);
      cue = null;
      speedMs = 0;
      throttle = 0;
      wheelSteer = 0;
    }
  } else if (cue) {
    const s = cue.shot;
    const est = cue.intro ? landerCam(cue.qi, true) : roverCam(s.back + 4.5, s.side * 0.8, s.up + 0.9, s.look, s.lookY);
    const near = cue.intro ? landerCam(cue.qi, false) : roverCam(s.back + 2.2, s.side * 0.85, s.up + 0.4, s.look, s.lookY);
    const onRover = roverCam(s.back, s.side, s.up, s.look, s.lookY);
    const drive = roverCam(6.2, 1.35, 2.55, 1.4, 0.72);
    const flyAt = cue.estT + cue.flyT;
    if (cue.t <= cue.estT) {
      pose = mixPose(est, near, smoothstep(0, cue.estT, cue.t));
    } else if (cue.t <= flyAt) {
      pose = mixPose(near, onRover, smoothstep(cue.estT, flyAt, cue.t));
    } else {
      pose = mixPose(onRover, drive, smoothstep(flyAt, cue.dur, cue.t));
    }
    if (cue.t >= cue.dur) pose = drive;
  }
  if (crashCut && crashCut.cam) {
    pose = crashCut.cam;
  } else if (tumble) {
    const s = tumble.sign || 1;
    pose = roverCam(8.4, -s * 5.2, 4.1, 0.3, 1.1);
  } else if (tipped && (Math.abs(leader._roll || 0) > 0.75 || Math.abs(leader._pitch || 0) > 0.75)) {
    const s = Math.sign(leader._roll || leader._pitch || 1) || 1;
    pose = roverCam(9.5, -s * 6.6, 4.8, 0.1, 0.7);
  }
  if (pose) {
    camPos.set(pose.px, pose.py, pose.pz);
    look.set(pose.lx, pose.ly, pose.lz);
  } else {
    const bx = Math.sin(yaw);
    const bz = Math.cos(yaw);
    camPos.set(
      leader.group.position.x - bx * 6.2 + bz * 1.35,
      leader.group.position.y + 2.55,
      leader.group.position.z - bz * 6.2 - bx * 1.35
    );
    look.set(leader.group.position.x + bx * 1.4, leader.group.position.y + 0.72, leader.group.position.z + bz * 1.4);
  }
  liftCam(camPos, look);
  camera.position.copy(camPos);
  camera.lookAt(look);
  if (guide.visible && era === "drive") {
    guide.position.set(guideAt.x, terrainHeight(guideAt.x, guideAt.z), guideAt.z);
  }

  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  earth.position.copy(camera.position).addScaledVector(earthDir, EARTH_DIST);
  sunGlow.position.copy(camera.position).addScaledVector(sunDir, 500);
  sun.position.set(leader.group.position.x + sunDir.x * 36, leader.group.position.y + sunDir.y * 36, leader.group.position.z + sunDir.z * 36);
  sun.target.position.copy(leader.group.position);
  camFill.position.copy(camera.position);
  camFill.target.position.copy(leader.group.position);

  composer.render();
}

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth, window.innerHeight);
});

resetPose();
frame();
document.getElementById("begin").addEventListener("click", () => {
  const intro = document.getElementById("loader");
  intro.classList.add("hide");
  hideCard();
  briefSeen = true;
  questSay();
});
</script>
</body>
</html>
